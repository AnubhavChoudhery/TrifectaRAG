name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, core + pdf)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[pdf,dev]"

      - name: C++ tests (if a prior in-tree build exists)
        run: |
          if [ -d build ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "No in-tree CMake build; wheel build already compiled the extension."
          fi

      - name: Python tests
        run: |
          python tests/test_phase5.py
          python tests/test_phase6.py
          python tests/test_phase7.py
          python tests/test_package.py
          python tests/test_cli.py

      - name: CLI smoke
        run: |
          trifecta version
          trifecta --help
          python -m trifecta version
